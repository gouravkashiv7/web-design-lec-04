<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Why is this worse than a button?</title>
  </head>
  <body>
    <!-- It looks like a button and works with a mouse.
         List everything that is lost compared with a real <button>. -->

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <div onclick="alert('Submitted?')">Submit</div>
    </form>
  </body>
